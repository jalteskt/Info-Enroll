<template id="help">
  <div class="modal-header">
    <div>
      <div class="eyebrow">A little guidance</div>
      <h2 id="modal-title">Plan with confidence.</h2>
    </div>
    <button
      class="icon-button"
      data-action="close-modal"
      aria-label="Close guide"
    >
      {{icon}}
    </button>
  </div>
  <div class="modal-body">{{content}}</div>
  <div class="modal-footer">
    <button class="button button-primary" data-action="close-modal">
      Got it {{icon3}}
    </button>
  </div>
</template>

<template id="open-sections">
  <div class="modal-header">
    <div>
      <div class="eyebrow">{{code}}</div>
      <h2 id="modal-title">Choose your section.</h2>
    </div>
    <button
      class="icon-button"
      data-action="close-modal"
      aria-label="Close section chooser"
    >
      {{icon}}
    </button>
  </div>
  <form id="section-form" data-course-id="{{id}}">
    <div class="modal-body">
      <p class="modal-description">
        {{title}} · {{units}} units
        <br />
        Choose a section that works with the rest of your plan.
      </p>
      {{content}}{{content7}}
      <p class="modal-error" id="section-error" role="alert"></p>
    </div>
    <div class="modal-footer">
      {{removeButton}}
      <button class="button" type="button" data-action="close-modal">
        Cancel
      </button>
      <button class="button button-primary" type="submit">
        {{content8}} {{icon9}}
      </button>
    </div>
  </form>
</template>

<template id="dialogs-3">
  <span class="badge badge-{{color}}">{{label}}</span>
</template>

<template id="help-2">
  <div class="help-item">
    <h3>{{h}}</h3>
    <p>{{p}}</p>
  </div>
</template>

<template id="open-sections-2">
  <div class="pair-note">
    {{icon}}
    <span>{{note}}</span>
  </div>
</template>

<template id="open-sections-3">
  <label class="section-option">
    <input
      type="radio"
      name="section"
      value="{{id}}"
      {{content}}
      {{content3}}
    />
    <span class="section-option-title">
      {{name}}
      <span class="badge {{content5}}">{{content6}}</span>
    </span>
    <p>{{prof}}</p>
    {{content8}}{{content9}}
  </label>
</template>

<template id="open-sections-4">
  <p>{{content}}{{meetingLabel}}</p>
</template>

<!-- Shown only when the subject is already in the plan. -->
<template id="open-sections-remove">
  <button
    class="button button-remove"
    type="button"
    data-remove="{{id}}"
    aria-label="Remove {{title}}{{lab}} from my enrollment"
  >
    {{icon}} Remove subject
  </button>
</template>

<template id="open-sections-5">
  <p class="conflict">Schedule conflicts with {{conflict}}.</p>
</template>
