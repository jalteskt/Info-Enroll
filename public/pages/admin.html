<!-- Edit markup here. {{name}} placeholders receive values from JavaScript. -->

<!-- ============================== Overview ============================== -->
<template id="admin-view">
  <div class="stats-grid">{{stat}}{{stat2}}{{stat3}}</div>
  <section class="panel admin-period-panel">
    <div class="panel-header">
      <div>
        <p class="eyebrow">ACADEMIC CALENDAR</p>
        <h2 class="panel-title">{{periodTitle}}</h2>
        <p class="muted">{{periodText}}</p>
      </div>
      {{periodBadge}}
    </div>
    <div class="panel-header">
      <p class="page-description">{{periodHint}}</p>
      <button
        type="button"
        class="button {{periodButtonClass}}"
        data-action="{{periodAction}}"
        {{periodDisabled}}
      >
        {{periodIcon}} {{periodButton}}
      </button>
    </div>
  </section>
  <section class="panel">
    <div class="panel-header">
      <div>
        <p class="eyebrow">ENROLLMENT PERIODS</p>
        <h2 class="panel-title">Every term</h2>
        <p class="muted">
          The next period opens only when every section has submitted grades.
        </p>
      </div>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Term</th>
            <th scope="col">Status</th>
            <th scope="col">Sections</th>
            <th scope="col">Enrolled students</th>
            <th scope="col">Grades</th>
          </tr>
        </thead>
        <tbody>{{rows}}</tbody>
      </table>
    </div>
  </section>
</template>

<template id="admin-period-row">
  <tr>
    <td><strong>{{term}}</strong></td>
    <td>{{status}}</td>
    <td>{{sections}}</td>
    <td>{{enrollments}}</td>
    <td>{{grades}}</td>
  </tr>
</template>

<!-- ============================== Sections ============================== -->
<template id="admin-sections">
  <section class="panel">
    <div class="panel-header">
      <div>
        <p class="eyebrow">COURSE OFFERINGS</p>
        <h2 class="panel-title">{{title}}</h2>
        <p class="muted">{{subtitle}}</p>
      </div>
      <div class="toolbar">
        <select class="input" id="staff-term" aria-label="Term">{{terms}}</select>
        {{newButton}}
      </div>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Course</th>
            <th scope="col">Section</th>
            <th scope="col">Schedule</th>
            <th scope="col">Professor</th>
            <th scope="col">Students</th>
            <th scope="col">Grades</th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody>{{rows}}</tbody>
      </table>
    </div>
  </section>
</template>

<template id="admin-section-row">
  <tr>
    <td>
      <strong>{{code}}</strong>
      <div class="muted">{{title}}</div>
    </td>
    <td>{{name}}</td>
    <td>{{schedule}}</td>
    <td>{{professor}}</td>
    <td>{{students}}</td>
    <td>{{grades}}</td>
    <td><div class="toolbar">{{actions}}</div></td>
  </tr>
</template>

<template id="admin-new-section-button">
  <button
    type="button"
    class="button button-primary"
    data-action="staff-section-new"
  >
    {{icon}} New section
  </button>
</template>

<!-- ============================== Grades ============================== -->
<template id="admin-grades">
  <section class="panel">
    <div class="panel-header">
      <div>
        <p class="eyebrow">MISSING GRADES</p>
        <h2 class="panel-title">Sections waiting for submission</h2>
        <p class="muted">
          You can encode and submit grades for any section of a closed period.
        </p>
      </div>
      {{pendingBadge}}
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Course</th>
            <th scope="col">Term</th>
            <th scope="col">Professor</th>
            <th scope="col">Progress</th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody>{{pendingRows}}</tbody>
      </table>
    </div>
  </section>
  <section class="panel">
    <div class="panel-header">
      <div>
        <p class="eyebrow">INCOMPLETE GRADES</p>
        <h2 class="panel-title">INC waiting to be completed</h2>
        <p class="muted">
          Replace an INC with the final grade once the student completes the
          requirements.
        </p>
      </div>
      {{incBadge}}
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Student</th>
            <th scope="col">Course</th>
            <th scope="col">Term</th>
            <th scope="col">Final grade</th>
          </tr>
        </thead>
        <tbody>{{incRows}}</tbody>
      </table>
    </div>
  </section>
</template>

<template id="admin-pending-row">
  <tr>
    <td>
      <strong>{{code}}</strong>
      <div class="muted">{{name}} · {{title}}</div>
    </td>
    <td>{{term}}</td>
    <td>{{professor}}</td>
    <td>{{progress}}</td>
    <td>
      <button
        type="button"
        class="button"
        data-action="staff-grade-open-{{id}}"
      >
        Encode grades
      </button>
    </td>
  </tr>
</template>

<template id="admin-inc-row">
  <tr>
    <td>
      <strong>{{student}}</strong>
      <div class="muted">{{studentNo}}</div>
    </td>
    <td>
      <strong>{{code}}</strong>
      <div class="muted">{{title}}</div>
    </td>
    <td>{{term}}</td>
    <td>
      <div class="toolbar">
        <select
          class="input"
          id="inc-{{sectionId}}-{{studentNo}}"
          aria-label="Final grade for {{student}}"
        >
          <option value="">Select grade</option>
          {{options}}
        </select>
        <button
          type="button"
          class="button"
          data-action="staff-inc-{{sectionId}}-{{studentNo}}"
        >
          Complete
        </button>
      </div>
    </td>
  </tr>
</template>

<!-- ============================== Professors ============================== -->
<template id="admin-professors">
  <section class="panel">
    <div class="panel-header">
      <div>
        <p class="eyebrow">FACULTY</p>
        <h2 class="panel-title">Professors</h2>
        <p class="muted">
          A professor who has taught a section is deactivated, not deleted.
        </p>
      </div>
      <button
        type="button"
        class="button button-primary"
        data-action="staff-prof-new"
      >
        {{icon}} Add professor
      </button>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Username</th>
            <th scope="col">Status</th>
            <th scope="col">Sections</th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody>{{rows}}</tbody>
      </table>
    </div>
  </section>
</template>

<template id="admin-prof-row">
  <tr>
    <td><strong>{{name}}</strong></td>
    <td>{{username}}</td>
    <td>{{status}}</td>
    <td>{{sections}}</td>
    <td><div class="toolbar">{{actions}}</div></td>
  </tr>
</template>

<!-- ============================== Shared ============================== -->
<template id="admin-empty-row">
  <tr>
    <td colspan="{{span}}" class="muted">{{message}}</td>
  </tr>
</template>

<template id="admin-action-button">
  <button type="button" class="button {{kind}}" data-action="{{action}}">
    {{label}}
  </button>
</template>

<template id="admin-option">
  <option value="{{value}}" {{selected}}>{{label}}</option>
</template>

<!-- ============================== Dialogs ============================== -->
<template id="admin-confirm">
  <div class="modal-header">
    <div>
      <div class="eyebrow">{{eyebrow}}</div>
      <h2 id="modal-title">{{title}}</h2>
    </div>
    <button class="icon-button" data-action="close-modal" aria-label="Cancel">
      {{icon}}
    </button>
  </div>
  <div class="modal-body">
    <p class="modal-description">{{text}}</p>
    <p class="modal-error" id="staff-form-error" role="alert"></p>
  </div>
  <div class="modal-footer">
    <button class="button" data-action="close-modal">Cancel</button>
    <button class="button button-primary" data-action="{{action}}">
      {{confirm}}
    </button>
  </div>
</template>

<template id="admin-section-form">
  <form id="staff-form" data-staff-form="section">
    <div class="modal-header">
      <div>
        <div class="eyebrow">{{term}}</div>
        <h2 id="modal-title">New section</h2>
      </div>
      <button
        type="button"
        class="icon-button"
        data-action="close-modal"
        aria-label="Cancel"
      >
        {{icon}}
      </button>
    </div>
    <div class="modal-body admin-form">
      <label class="admin-field admin-field-wide">
        <span>Course</span>
        <select class="input" name="code" required>{{courses}}</select>
      </label>
      <label class="admin-field">
        <span>Section number</span>
        <input
          class="input"
          name="sectionNo"
          type="number"
          min="1"
          max="255"
          placeholder="Next free number"
        />
      </label>
      <label class="admin-field">
        <span>Professor (lecture and laboratory)</span>
        <select class="input" name="professorId" required>
          <option value="">Choose a professor</option>
          {{professors}}
        </select>
      </label>
      <fieldset class="admin-fieldset">
        <legend>Lecture, or the whole subject if it has no lab</legend>
        {{lecFields}}
      </fieldset>
      <fieldset class="admin-fieldset">
        <legend>Laboratory (used only for subjects with a lab)</legend>
        {{labFields}}
      </fieldset>
      <p class="muted admin-field-wide">
        A subject with a lab gets both sections, with the same number and
        professor. Their times must not overlap.
      </p>
      <p class="modal-error admin-field-wide" id="staff-form-error" role="alert"></p>
    </div>
    <div class="modal-footer">
      <button type="button" class="button" data-action="close-modal">
        Cancel
      </button>
      <button type="submit" class="button button-primary">
        Create section
      </button>
    </div>
  </form>
</template>

<template id="admin-meeting-fields">
  <label class="admin-field">
    <span>Day</span>
    <select class="input" name="{{prefix}}Day">{{days}}</select>
  </label>
  <label class="admin-field">
    <span>Starts</span>
    <input class="input" name="{{prefix}}Start" type="time" value="{{start}}" />
  </label>
  <label class="admin-field">
    <span>Ends</span>
    <input class="input" name="{{prefix}}End" type="time" value="{{end}}" />
  </label>
</template>

<template id="admin-prof-form">
  <form id="staff-form" data-staff-form="professor">
    <div class="modal-header">
      <div>
        <div class="eyebrow">Faculty</div>
        <h2 id="modal-title">Add professor</h2>
      </div>
      <button
        type="button"
        class="icon-button"
        data-action="close-modal"
        aria-label="Cancel"
      >
        {{icon}}
      </button>
    </div>
    <div class="modal-body admin-form">
      <label class="admin-field">
        <span>First name</span>
        <input class="input" name="firstName" required autocomplete="off" />
      </label>
      <label class="admin-field">
        <span>Last name</span>
        <input class="input" name="lastName" required autocomplete="off" />
      </label>
      <label class="admin-field">
        <span>Username</span>
        <input class="input" name="username" required autocomplete="off" />
      </label>
      <label class="admin-field">
        <span>Temporary password</span>
        <input
          class="input"
          name="password"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
        />
      </label>
      <p class="modal-error admin-field-wide" id="staff-form-error" role="alert"></p>
    </div>
    <div class="modal-footer">
      <button type="button" class="button" data-action="close-modal">
        Cancel
      </button>
      <button type="submit" class="button button-primary">Add professor</button>
    </div>
  </form>
</template>

<template id="admin-grade-sheet">
  <div class="modal-header">
    <div>
      <div class="eyebrow">{{term}}</div>
      <h2 id="modal-title">{{code}} / {{name}}</h2>
      <p class="muted">{{title}} · {{professor}}</p>
    </div>
    <button class="icon-button" data-action="close-modal" aria-label="Close">
      {{icon}}
    </button>
  </div>
  <div class="modal-body">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">Student number</th>
            <th scope="col">Student name</th>
            <th scope="col">Final grade</th>
            <th scope="col">Standing</th>
          </tr>
        </thead>
        <tbody>{{rows}}</tbody>
      </table>
    </div>
    <p class="muted">
      Submitting locks the grades and records you as the submitter.
    </p>
    <p class="modal-error" id="staff-form-error" role="alert"></p>
  </div>
  <div class="modal-footer">
    <button class="button" data-action="staff-grade-save">Save draft</button>
    <button class="button button-primary" data-action="staff-grade-submit">
      Submit &amp; lock grades
    </button>
  </div>
</template>
