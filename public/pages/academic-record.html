<!-- Edit markup here. {{name}} placeholders receive values from JavaScript. -->

<template id="academic-record">
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Units passed {{icon}}</div>
      <div class="stat-value">
        {{unitsPassed}}
        <small>units passed</small>
      </div>
      <p>{{coursesPassed}}</p>
    </div>
    <div class="stat-card">
      <div class="stat-label">Term average {{icon2}}</div>
      <div class="stat-value">
        {{average}}
        <small>weighted average</small>
      </div>
      <p>For your most recent term</p>
    </div>
    <div class="stat-card">
      <div class="stat-label">Current standing {{icon3}}</div>
      <div class="stat-value">
        {{yearLevel}}
        <small>year level</small>
      </div>
      <p>{{standingNote}}</p>
    </div>
  </div>
  <section class="panel">
    <div class="panel-header">
      <h2 class="panel-title">Subjects taken</h2>
      <span class="badge badge-green">{{passedBadge}}</span>
    </div>
    {{content}}
    <div class="academic-note">
      Grades appear once your professor submits them. For official academic
      records, contact the University Registrar.
    </div>
  </section>
</template>

<template id="academic-record-term">
  <div class="record-year">{{term}}</div>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th scope="col">COURSE CODE</th>
          <th scope="col">SUBJECT</th>
          <th scope="col">UNITS</th>
          <th scope="col">GRADE</th>
          <th scope="col">STATUS</th>
        </tr>
      </thead>
      <tbody>{{content}}</tbody>
    </table>
  </div>
</template>

<template id="academic-record-empty">
  <div class="schedule-empty">No completed terms yet.</div>
</template>

<template id="academic-record-2">
  <tr>
    <td class="muted">{{code}}</td>
    <td><strong>{{title}}</strong></td>
    <td>{{u}}</td>
    <td class="grade">{{grade}}</td>
    <td><span class="badge badge-{{color}}">{{status}}</span></td>
  </tr>
</template>
