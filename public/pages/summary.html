<template id="summary">
  <div class="summary-actions">
    <button class="button button-primary" type="button" data-action="print">
      {{printIcon}} Print / Save PDF
    </button>
  </div>
  <section class="panel summary-sheet" aria-labelledby="enrollment-summary-title">
    <div class="summary-letterhead">
      <img class="summary-seal" src="/assets/plm-seal.png" alt="PLM seal" width="56" height="56" />
      <div>
        <h2>Pamantasan ng Lungsod ng Maynila</h2>
        <p>BS Information Technology · Student Enrollment</p>
      </div>
    </div>
    <div class="summary-heading">
      <h3 id="enrollment-summary-title">Enrollment summary</h3>
      <span class="badge {{content}}">{{content3}}</span>
    </div>
    <div class="summary-meta">
      <div>
        <small>Student name</small>
        <strong>{{studentName}}</strong>
      </div>
      <div>
        <small>Student number</small>
        <strong>{{studentNo}}</strong>
      </div>
      <div>
        <small>Program / year level</small>
        <strong>BS Information Technology / {{yearLevel}} year</strong>
      </div>
      <div>
        <small>Academic term</small>
        <strong>{{TERM}}</strong>
      </div>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th scope="col">SUBJECT</th>
            <th scope="col">SECTION</th>
            <th scope="col">SCHEDULE</th>
            <th scope="col">UNITS</th>
          </tr>
        </thead>
        <tbody>{{content5}}</tbody>
      </table>
    </div>
    <div class="summary-totals">
      <div class="summary-total">
        <span>{{unitTotalLabel}}</span>
        <strong>{{totalUnits}}</strong>
      </div>
      <div class="summary-total">
        <span>Load status</span>
        <strong>{{loadStatus}}</strong>
      </div>
    </div>
    <div class="summary-footnote">
      {{icon7}}
      <span>
        {{content8}}
        <br />
        This is not an official enrollment document.
      </span>
    </div>
  </section>
</template>

<template id="summary-2">
  <tr>
    <td>
      <div class="course-code">{{code}}</div>
      <strong>{{title}}</strong>
    </td>
    <td>{{name}}</td>
    <td>{{content}}</td>
    <td>{{units}}</td>
  </tr>
</template>

<template id="summary-3">
  <div>{{meetingLabel}}{{content}}</div>
</template>

<template id="summary-4">
  <tr><td colspan="4">No subjects selected.</td></tr>
</template>
