<template id="login">
  <main class="welcome-page">
    <section class="welcome-art">
      <div class="welcome-copy">
        <div class="eyebrow">Pamantasan ng Lungsod ng Maynila</div>
        <h1>Student enrollment system</h1>
      </div>
      <div class="welcome-footer">Karunungan. Kaunlaran. Kadakilaan.</div>
    </section>
    <section class="welcome-form">
      <div class="login-card">
        <h2>Sign in</h2>
        <div class="login-roles" aria-label="Account type">{{content}}</div>
        <form id="login-form">
          <label class="login-label" for="login-username">{{content4}}</label>
          <input
            class="login-input"
            id="login-username"
            placeholder="{{content5}}"
            autocomplete="username"
            required
          />
          <label class="login-label" for="login-password">Password</label>
          <div class="password-wrap">
            <input
              class="login-input"
              id="login-password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button
              class="icon-button"
              type="button"
              data-action="show-password"
              aria-label="Show password"
            >
              {{icon}}
            </button>
          </div>
          <p class="modal-error" id="login-error" role="alert"></p>
          <button class="button button-primary" type="submit">
            Login
          </button>
        </form>
        {{demoLogin}}
      </div>
    </section>
  </main>
</template>

<template id="demo-login">
  <button type="button" class="button button-quiet" data-demo-login>
    Use demo {{role}} account
  </button>
</template>

<template id="login-2">
  <button
    class="{{content}}"
    data-login-role="{{r}}"
    aria-pressed="{{content3}}"
  >
    {{content4}}
  </button>
</template>
